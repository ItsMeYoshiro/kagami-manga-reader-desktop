appId: dev.kaioedu.kagami
productName: Kagami
directories:
  buildResources: build
  output: dist

files:
  - out/**
  - '!**/{.vscode,.idea,.git}'
  - '!src/**'
  - '!**/*.map'

# The whole Suwayomi bundle (JRE + jar) goes into resources/server. That is
# what makes the app a single .exe: the user never installs Java.
# Patterns are relative to `from`, and inside ../server everything lives under
# the versioned folder (Suwayomi-Server-vX.Y.Z-windows-x64/). Without the
# leading `**/` the exclusions match nothing and the whole bundle is copied.
extraResources:
  - from: ../server
    to: server
    filter:
      - '**/*'
      - '!**/electron/**'          # the server ships its own Electron (293 MB) we do not use
      - '!**/*.bat'
      - '!**/Suwayomi-Launcher.jar'

win:
  # Generated by `python scripts-icon.py`. Feeds the .exe, the installer, the
  # shortcut and the Add/Remove Programs entry.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
