name: Release

# Builds the Windows installer on GitHub's runners and records where it came
# from. The point is not the build -- `npm run dist` does the same thing on any
# machine -- but the provenance: an installer built here can be traced back to
# this repository, this commit and this workflow run.
#
# The installer is still unsigned, so Windows SmartScreen will warn either way.
# Attestation answers a different question: not "does Windows trust this
# publisher" but "is this file really what this source code builds into".
#
#   gh attestation verify Kagami-0.1.0-x64.exe \
#     --repo ItsMeYoshiro/kagami-manga-reader-desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build for and attach the installer to'
        required: true

permissions:
  contents: write # attach the installer to the release
  id-token: write # mint the short-lived Sigstore signing certificate
  attestations: write # record the provenance statement

env:
  SUWAYOMI: v2.3.2243

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The server bundle is a ~500 MB release artifact, so it is not in the
      # repository. Both paths.ts and electron-builder look for it next to the
      # checkout -- the same layout the README asks contributors for.
      # pwsh, not bash: the `tar` on PATH in Git Bash is GNU tar, which cannot
      # read a zip. Windows ships bsdtar as tar.exe, and that one can.
      - name: Fetch Suwayomi-Server
        shell: pwsh
        run: |
          $ver = $env:SUWAYOMI
          $name = "Suwayomi-Server-${ver}-windows-x64"
          curl.exe -fL --retry 3 -o server.zip `
            "https://github.com/Suwayomi/Suwayomi-Server/releases/download/${ver}/${name}.zip"
          New-Item -ItemType Directory -Force ../server | Out-Null
          tar.exe -xf server.zip -C ../server
          if ($LASTEXITCODE -ne 0) { throw "could not unpack the bundle" }
          Remove-Item server.zip
          if (-not (Test-Path "../server/${name}/bin/Suwayomi-Server.jar")) {
            Get-ChildItem -Recurse ../server | Select-Object -First 20 FullName
            throw "the bundle did not unpack where the build expects it"
          }

      - run: npm ci

      # electron-builder starts publishing on its own as soon as it detects CI,
      # and then fails asking for a GH_TOKEN. Packaging and releasing are
      # separate steps here: the installer is attached below, once attested.
      # `never` is a CLI policy, not a config key -- it has no meaning inside
      # electron-builder.yml, where `publish` names a provider.
      - run: npm run dist -- --publish never

      - name: Attest the installer
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Kagami-*-x64.exe

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release upload "$tag" dist/Kagami-*-x64.exe --clobber
